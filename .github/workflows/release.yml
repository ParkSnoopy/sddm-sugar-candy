name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the theme version
        run: |
          version=$(sed -n 's/^Version=//p' metadata.desktop)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Version=${version} in metadata.desktop" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Extract the changelog entry
        run: |
          awk -v v="${VERSION}" '
            /^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog entry for [${VERSION}] in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Build the theme archive
        run: |
          mkdir -p dist/sugar-candy
          cp -r Assets Backgrounds Components Previews \
            Main.qml theme.conf metadata.desktop \
            AUTHORS CHANGELOG.md COPYING CREDITS README.md \
            dist/sugar-candy/
          tar -czf "sugar-candy-${VERSION}.tar.gz" -C dist sugar-candy

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "sugar-candy-${VERSION}.tar.gz" \
            --title "Sugar Candy ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
